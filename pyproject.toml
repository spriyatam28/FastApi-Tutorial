[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "Practice project to learn about FastAPI and backend development"
readme = "README.md"
requires-python = "==3.14.1"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.125.0",
    "pydantic>=2.12.5",
    "ruff>=0.14.10",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev=["fastapi[standard]", "pytest"]
